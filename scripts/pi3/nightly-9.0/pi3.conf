# /etc/systemd/system/livi-kiosk.service.d/pi3.conf
# Pi 3 B+ kiosk ayarları. Kurulum scripti servisi yeniden yazsa da bu dosyaya dokunmaz.
[Service]
# bcm2835 çözücünün reddettiği colorimetry değerini bt709'a çeviren shim (scripts/pi3/livi-colorimetry-shim.c)
Environment=LIVI_GST_PRELOAD=/usr/local/lib/livi/livi-colorimetry-shim.so
# Settings → System → Software Update bu depodan beslenir; f-io yayınları cihaza gelmez
Environment=UPDATE_REPO=ahmtyldr/LIVI
