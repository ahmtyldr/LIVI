# Production headless kiosk drop-in for a PACKAGED livi-ui.
# /etc/systemd/system/livi-kiosk.service.d/headless.conf
#
# The AppImage carries the LVGL UI at resources/ui/livi-ui, so no
# LIVI_HEADLESS_JS / LIVI_UI_BIN dev overrides are needed: livi-headless.sh
# runs the packaged out/main/headless.js and uiProcess.ts spawns
# resources/ui/livi-ui itself.
[Service]
ExecStart=
ExecStart=/usr/bin/cage -s -- /usr/local/lib/livi/livi-headless.sh
